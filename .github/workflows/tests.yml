name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies (CPU build of PyTorch; GPU tests are skipped on CI)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy highspy pytest ziglang ruff
      - name: Lint
        run: ruff check samadhan tests benchmarks docs
      - name: Build the C++ core
        run: python -c "from samadhan.core import build; print(build())"
      - name: Run tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t samadhan .
      - name: Self-check inside the container
        run: docker run --rm samadhan
      - name: Solve a model file mounted from the host
        run: docker run --rm -v "$PWD/tests:/models" samadhan solve /models/tiny_milp.mps --quiet
