[project]
name = "samadhan"
version = "0.1.0"
description = "Sovereign GPU-accelerated optimization solver (SIH 2026, PS SIH26119)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.12", "torch>=2.4"]

[project.optional-dependencies]
bench = ["highspy>=1.7"]
test = ["highspy>=1.7", "pytest>=8"]

[project.scripts]
samadhan = "samadhan.__main__:main"

[tool.setuptools]
packages = ["samadhan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*[Ss]parse.*:UserWarning"]
